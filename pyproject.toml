[project]
name = "rb-google-oauth"
dynamic = ["version"]
description = "Shared Google authorization for CLI tools: a service account and API keys in one keychain slot."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "bolandau" }]
dependencies = [
    "google-auth[requests]>=2.30",
    "keyring>=25.0",
    "typer>=0.27,<0.29",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "syrupy>=4.8", "ty>=0.0.80"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

# Версия — из git-тега vX.Y.Z (docs/standard-release.md в tools/), не из этого файла.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# Команды — не в commands/*.py: их строит make_auth_app (scripts/check_command_docstrings.py).
[tool.cli-generator]
commands = "src/*/auth_command.py"

[tool.hatch.build.targets.sdist]
# What a release must not carry: the agent's own files, the forge configs and the dev tooling. The wheel is
# narrow already (`packages = ["src/<pkg>"]`); this is about the sdist, which is otherwise a copy of the repo.
exclude = [
  "/.agents",
  "/.claude",
  "/.claude-plugin",
  "/.gitea",
  "/.github",
  "/docs",
  "/scripts",
  "/uv.lock",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CODING_STANDARDS.md",
  "/CONTEXT.md",
  "/.copier-answers.yml",
  "^\\.gitignore$",
  "/.gitleaks.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/google_oauth"]

[tool.rb.install]
homeserver = []
mac = false

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src"]
core = "ctrace"  # 3.14: the default core grows memory with every CLI invoke

[tool.coverage.report]
# Планка покрытия — не ниже; поднимать, не опускать.
fail_under = 95
show_missing = true

[tool.ty.terminal]
# Гейт валят только ошибки: свежий ty (>= 0.0.84) иначе выходит с 1 и на предупреждениях.
error-on-warning = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # assert — смысл теста; фейковые ключи — не секреты
"scripts/*" = ["S603", "S607"]  # subprocess с фиксированным argv (git, uv), без shell
