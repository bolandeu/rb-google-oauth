[project]
name = "google-oauth"
version = "0.1.0"
description = "Общая авторизация Google для CLI-инструментов (gsc, …): сервисный аккаунт и API-ключи в общем слоте keychain, access token с автообновлением, команда auth"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "bolandau" }]
dependencies = [
    "google-auth[requests]>=2.30",
    "keyring>=25.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "ty>=0.0.80"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_oauth"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Планка покрытия — не ниже; поднимать, не опускать.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # assert — смысл теста; фейковые ключи — не секреты
